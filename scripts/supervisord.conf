[supervisord]
nodaemon=true
logfile=logs/supervisord.log
pidfile=logs/supervisord.pid
childlogdir=logs

[program:agent]
command=python -m agent.main
directory=%(here)s/..
autostart=true
autorestart=true
stdout_logfile=logs/agent.out.log
stderr_logfile=logs/agent.err.log
startsecs=5

[program:api]
command=python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
directory=%(here)s/..
autostart=true
autorestart=true
stdout_logfile=logs/api.out.log
stderr_logfile=logs/api.err.log
startsecs=3
